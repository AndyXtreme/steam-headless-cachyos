
# wayvnc - exposes the labwc/wlroots output as an RFB (VNC) server on
# 127.0.0.1:PORT_VNC. The noVNC web frontend bridges this to the browser.
[program:wayvnc]
priority=40
autostart=false
autorestart=true
# Allow the session/compositor time to come up before the first attempt.
startretries=50
user=%(ENV_USER)s
directory=/home/%(ENV_USER)s
command=/usr/bin/start-wayvnc.sh
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",PORT_VNC="%(ENV_PORT_VNC)s"
stopsignal=INT
stdout_logfile=/home/%(ENV_USER)s/.cache/log/wayvnc.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=7
stderr_logfile=/home/%(ENV_USER)s/.cache/log/wayvnc.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=7
