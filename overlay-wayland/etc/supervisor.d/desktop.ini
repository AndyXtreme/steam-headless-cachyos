
# Wayland desktop session (labwc / wlroots).
# Replaces the upstream XFCE-on-Xorg "desktop" program. It still touches
# /tmp/.started-desktop so that downstream services (sunshine) can wait on it.
[program:desktop]
priority=35
autostart=true
autorestart=true
user=%(ENV_USER)s
directory=/home/%(ENV_USER)s
command=/usr/bin/start-wayland-session.sh
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",XDG_SESSION_TYPE="wayland",XDG_CURRENT_DESKTOP="labwc:wlroots"
stopsignal=INT
stdout_logfile=/home/%(ENV_USER)s/.cache/log/desktop.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=7
stderr_logfile=/home/%(ENV_USER)s/.cache/log/desktop.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=7
