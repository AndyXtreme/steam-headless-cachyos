
# Wayland variant of the upstream vnc.ini.
# The x11vnc program is removed (replaced by wayvnc.ini). Only the noVNC web
# frontend remains here; it bridges 127.0.0.1:PORT_VNC (served by wayvnc) to
# the browser on PORT_NOVNC_WEB. Toggled on/off by 90-configure_vnc.sh.
[program:frontend]
priority=45
autostart=false
autorestart=true
user=root
command=/opt/frontend/utils/run.sh --web-port %(ENV_PORT_NOVNC_WEB)s --remote-host localhost --vnc-port %(ENV_PORT_VNC)s --audio-port %(ENV_PORT_AUDIO_STREAM)s
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s"
stopsignal=INT
stdout_logfile=/home/%(ENV_USER)s/.cache/log/novnc.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=7
stderr_logfile=/home/%(ENV_USER)s/.cache/log/novnc.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=7
