
# seatd - seat management daemon. Required so labwc's libinput backend can open
# input devices as the non-root user. Sunshine creates virtual input devices via
# /dev/uinput; without the libinput backend + a seat, the headless compositor
# never reads them (Moonlight mouse/keyboard/gamepad would not work).
# The socket group is the default user's primary group ("default") so labwc can
# connect. Starts before the desktop (priority < 35).
[program:seatd]
priority=14
autostart=true
autorestart=true
user=root
command=/usr/bin/seatd -g default
stopsignal=INT
stdout_logfile=/var/log/supervisor/seatd.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/seatd.err.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=3
