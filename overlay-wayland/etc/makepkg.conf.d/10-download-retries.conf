#!/hint/bash
# makepkg download agents with retries on *all* errors.
# The stock agents retry only on transient HTTP errors, not on TLS/connection
# failures - GitHub's release-asset CDN drops handshakes intermittently
# ("curl: (35) TLS connect error: unexpected eof"), which aborts AUR builds.
DLAGENTS=('file::/usr/bin/curl -qgC - -o %o %u'
          'ftp::/usr/bin/curl -qgfC - --ftp-pasv --retry 5 --retry-all-errors --retry-delay 5 -o %o %u'
          'http::/usr/bin/curl -qgb "" -fLC - --retry 5 --retry-all-errors --retry-delay 5 -o %o %u'
          'https::/usr/bin/curl -qgb "" -fLC - --retry 5 --retry-all-errors --retry-delay 5 -o %o %u'
          'rsync::/usr/bin/rsync --no-motd -z %u %o'
          'scp::/usr/bin/scp -C %u %o')
