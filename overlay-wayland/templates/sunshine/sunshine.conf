# Sunshine configuration - CachyOS / Wayland (labwc / wlroots) variant.
# Capture is performed via the wlroots screencopy protocol; encoding via NVENC.

min_log_level = info

# NOTE: the upstream XFCE "minimise all windows" prep command is intentionally
# omitted here - it does not exist under labwc/Wayland.
global_prep_cmd = [{"do":"","undo":"/usr/bin/sunshine-stop"}]

file_apps = apps.json
channels = 2

# Force the NVIDIA hardware encoder (RTX 4060 Ti). Set to "software" to fall
# back to CPU encoding if NVENC is unavailable.
encoder = nvenc

# On a headless wlroots compositor Sunshine captures the only virtual output
# automatically. If you add more outputs, set output_name (see `wlr-randr`).
# output_name = HEADLESS-1
